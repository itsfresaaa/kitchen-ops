<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Kitchen Operations</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Roboto Condensed", sans-serif;
      background: #fff;
      color: #000;
      max-width: 402px;
      margin: 0 auto;
      padding: 0 0 80px;
    }

    @media (min-width: 500px) {
      body { max-width: 100%; padding: 0 40px 80px; }
    }

    /* ── Header ── */
    .header {
      text-align: center;
      padding: 28px 20px 18px;
    }
    .logo {
      width: 157px;
      height: 44px;
      object-fit: contain;
      display: block;
      margin: 0 auto;
    }
    .kitchen-ops {
      font-weight: 900;
      font-size: 9px;
      letter-spacing: 0.72em;
      color: #F93B1D;
      text-transform: uppercase;
      margin-top: 15px;
      padding-right: 0em;
    }

    /* ── Divider ── */
    .divider {
      border-top: 1px solid #F93B1D;
      margin: 0 51px;
    }

    /* ── Select label ── */
    .select-wrap {
      padding: 14px 51px 0;
    }
    .section-header {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .section-label {
      font-weight: 700;
      font-size: 12px;
      color: #F93B1D;
      white-space: nowrap;
      letter-spacing: 0.08em;
    }
    .section-rule {
      flex: 1;
      height: 0;
      border-top: 0.5px solid #F93B1D;
      opacity: 0.4;
    }

    /* ── Cards ── */
    .cards {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 12px 51px 0;
    }

    .card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(245, 245, 245, 0.54);
      border: 0.5px solid #F93B1D;
      border-radius: 5px;
      padding: 11px 12px;
      text-decoration: none;
      transition: opacity 0.12s;
    }
    .card:active {
      opacity: 0.6;
    }

    .card-name {
      font-weight: 700;
      font-size: 10px;
      color: #F93B1D;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .card-arrow {
      font-size: 16px;
      color: #F93B1D;
      font-weight: 700;
      line-height: 1;
    }

  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <img class="logo" src="https://images.squarespace-cdn.com/content/v1/6044045ecacc5f3deb4792ea/926ddcee-8c67-481f-8ec1-66bac7273c59/weblogo_hoko+copy.png?format=1500w" alt="HOKO">
    <div class="kitchen-ops">Kitchen Operations</div>
  </div>

  <!-- Divider -->
  <div class="divider"></div>

  <!-- Select a station -->
  <div class="select-wrap">
    <div class="section-header">
      <span class="section-label">Select a Station</span>
      <span class="section-rule"></span>
    </div>
  </div>

  <!-- Station cards -->
  <div class="cards">

    <a class="card" href="Drink_Station_CHI.html">
      <span class="card-name">Drink Station</span>
      <span class="card-arrow">›</span>
    </a>

    <a class="card" href="Fryer_Station_CHI.html">
      <span class="card-name">Fryer Station</span>
      <span class="card-arrow">›</span>
    </a>

    <a class="card" href="Char_Siu_Station.html">
      <span class="card-name">Char Siu Station</span>
      <span class="card-arrow">›</span>
    </a>

  </div>

</body>
</html>
