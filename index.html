<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kitchen Daily Operation">
<title>Kitchen Daily Operation</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --max-w:393px;
  --pad:20px;
  --title:22px;
  --sub:13px;
  --card-title:16px;
  --card-sub:12px;
  --radius:14px;
}
@media(min-width:600px){
  :root{--max-w:600px;--pad:28px;--title:26px;--sub:14px;--card-title:17px;--card-sub:13px;}
}
@media(min-width:1024px){
  :root{--max-w:720px;--pad:36px;--title:28px;--sub:15px;--card-title:18px;--card-sub:14px;}
}
body{font-family:-apple-system,Arial,sans-serif;background:#f2f2f0;color:#2c2c2a;max-width:var(--max-w);margin:0 auto;min-height:100vh;padding:var(--pad);}
.header{padding:28px 0 32px;}
.header-label{font-size:10px;font-weight:600;color:#bbb;letter-spacing:0.1em;text-transform:uppercase;margin-bottom:8px;}
.header-title{font-size:var(--title);font-weight:700;margin-bottom:5px;}
.header-sub{font-size:var(--sub);color:#999;}
.cards{display:flex;flex-direction:column;gap:10px;}
.card{display:flex;align-items:center;text-decoration:none;background:#fff;border:1px solid #e4e4e0;border-radius:var(--radius);padding:16px 18px;transition:background 0.12s;gap:14px;}
.card:active{background:#f5f5f3;}
.card-icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;}
.card-body{flex:1;min-width:0;}
.card-name{font-size:var(--card-title);font-weight:600;color:#2c2c2a;margin-bottom:3px;}
.card-en{font-size:var(--card-sub);color:#aaa;margin-bottom:7px;}
.card-tags{display:flex;gap:5px;flex-wrap:wrap;}
.tag{display:inline-block;font-size:10px;font-weight:500;padding:2px 7px;border-radius:4px;}
.tag-wd{background:#E6F1FB;color:#0C447C;}
.tag-we{background:#EEEDFE;color:#3C3489;}
.tag-zh{background:#EEF6E0;color:#27500A;}
.tag-en{background:#FEF5E6;color:#633806;}
.card-arrow{color:#ddd;font-size:16px;flex-shrink:0;}
.footer{margin-top:40px;text-align:center;font-size:11px;color:#ccc;}
</style>
</head>
<body>

<div class="header">
  <p class="header-label">Kitchen Operations</p>
  <p class="header-title">Kitchen Daily Operation</p>
  <p class="header-sub">Select a station</p>
</div>

<div class="cards">

  <a class="card" href="Drink_Station_CHI.html">
    <div class="card-icon" style="background:#E1F5EE;">🧋</div>
    <div class="card-body">
      <div class="card-name">Drink Station</div>
    </div>
    <div class="card-arrow">›</div>
  </a>
  
  <a class="card" href="Fryer_Station_CHI.html">
    <div class="card-icon" style="background:#E1F5EE;">🐷</div>
    <div class="card-body">
      <div class="card-name">Fryer Station</div>
    </div>
    <div class="card-arrow">›</div>
  </a>
  
  <a class="card" href="Char_Siu_Station.html">
    <div class="card-icon" style="background:#FAECE7;">🍖</div>
    <div class="card-body">
      <div class="card-name">Char Siu Station</div>
      <div class="card-en">Char Siu Station</div>
      </div>
    </div>
    <div class="card-arrow">›</div>
  </a>

</div>

<div class="footer">itsfresaaa · github.io/kitchen-ops</div>

</body>
</html>
